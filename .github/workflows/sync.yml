name: sync

# Nightly upstream sync. This is the "I don't want to manually check for updates"
# machinery: it checks, opens a PR, and flags it for auto-merge — the PR merges
# itself once verify.yml goes green. A red verify check is what stops it and is
# the only signal that needs a human.
#
# actions/setup-node pinned below is the reproducible environment — no Docker needed,
# and no always-on host to own.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# The PR is pushed and opened with SYNC_PAT (a fine-grained PAT), not the built-in
# GITHUB_TOKEN: this repo blocks Actions from creating PRs, and PRs opened by the
# built-in token wouldn't trigger verify.yml anyway. The default token only checks out.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # A non-empty secret is not the same as a working one. An expired PAT gets a 401,
      # git falls back to an interactive prompt it can't answer on a runner, and the run
      # dies 20s later inside create-pull-request as a bare "git failed with exit code
      # 128" that points at git rather than at the credential. So prove the token works
      # here, before checkout, while there's still something readable to say about it.
      - name: Validate SYNC_PAT
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::SYNC_PAT secret is not set. Create a fine-grained PAT (contents + pull-requests: write, scoped to this repo) and add it in Settings -> Secrets and variables -> Actions."
            exit 1
          }
          # Needs only the auto-granted Metadata:Read, so this tests liveness without
          # assuming any particular permission is present.
          gh api "repos/$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            echo "::error::SYNC_PAT is set but rejected by GitHub — it has expired, been revoked, or lost access to $GITHUB_REPOSITORY. Mint a replacement (contents + pull-requests: write, scoped to this repo), then: gh secret set SYNC_PAT --repo $GITHUB_REPOSITORY"
            exit 1
          }
          # Best-effort early warning. GitHub sends this header only for PATs that carry
          # an expiry; with a no-expiration token it's absent and this is a silent no-op.
          # It must never fail the run — a missing header is not an error.
          # The header value is multi-word ("2026-08-24 10:56:08 UTC"), so take
          # everything after the colon rather than a single field.
          exp=$(gh api "repos/$GITHUB_REPOSITORY" -i 2>/dev/null \
                | tr -d '\r' \
                | awk 'tolower($1) ~ /^github-authentication-token-expiration:/ {sub(/^[^:]*: */,""); print}') || true
          if [ -n "$exp" ]; then
            left=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
            [ "$left" -gt 14 ] || echo "::warning::SYNC_PAT expires in ${left} day(s) ($exp). Rotate it before the nightly sync starts failing."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync upstreams
        run: node sync/sync.mjs

      - name: Read report
        id: report
        run: |
          echo "title=$(cat .sync-title)" >> "$GITHUB_OUTPUT"
          rm -f .sync-title

      - name: Open or update PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_PAT }}
          # Stable branch: successive nightly runs amend one PR instead of
          # spawning a new one every day.
          branch: sync/upstream
          base: main
          title: ${{ steps.report.outputs.title }}
          body-path: .sync-report.md
          commit-message: ${{ steps.report.outputs.title }}
          delete-branch: true
          add-paths: |
            skills/**
            sources.json
            README.md
            NOTICE
            .claude-plugin/**

      # Merge unattended once verify.yml goes green. Requires "Allow auto-merge"
      # plus a required status check on main — without a required check GitHub
      # refuses to enable auto-merge. gh is preinstalled on the runner.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}" --repo "${{ github.repository }}"
